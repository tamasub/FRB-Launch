; FRB Launch 初回インストール時の初期設定
;
; 初回起動時に、このファイルの設定値を使用して
; ユーザー用の state.ini を生成します。
;
; すでに %LOCALAPPDATA%\FRBLaunch\state.ini が存在する場合は、
; 既存のユーザー設定を優先し、上書きしません。
;
; 設定項目を省略した場合は、Launch本体の標準初期値を使用します。
; このファイルに記載された設定項目のみが読み込まれます。
; ウィンドウ位置・サイズ・操作履歴などは引き継ぎません。

[General]

; 画面テーマ（dark=ダーク / light=ライト）
appearance_theme=light

; マウスポインター自動移動
; true=自動移動OFF / false=自動移動ON
; ※キー名称と設定値の意味が逆になっているため注意
vdi_no_cursor_warp=true

; Launch画面の外側をクリックしたとき
; true=Launchを閉じる / false=Launchを閉じない
dismiss_on_outside_click=false

; Files Listでフォルダーを開く操作
; single=シングルクリック / double=ダブルクリック
folder_open_mode=double

; リモコン表示（4択）
; off=使用しない / column15=リモコンウィンドウ 1.5列へ表示
; window=リモコンウィンドウ 別Window / wheel=ぐりぐりボタンのみ
; 初回インストールでは off を推奨
remote_display_mode=off

; Pageボタンを非表示にする
; true=非表示 / false=表示
hide_page_buttons=true

; 旧バージョンとの互換用（新バージョンでは remote_display_mode を優先）
desktop_remote_enabled=false
experiment_remote_15_column=false

; ワープ差し棒（ぐりぐりスピナー）関連設定

; ワープ差し棒機能の有効・無効
; true=有効 / false=無効
experiment_mouse_pointer_rod=false

; ワープ差し棒のWindows方式
; true=Windows方式 / false=Qt方式
experiment_mouse_pointer_rod_windows=false

; ワープ差し棒のY座標追従機能
; true=有効 / false=無効
experiment_mouse_pointer_rod_smart=false
; Files第3列へのエディターご招待（初回インストール時の標準値）
; true=対応ファイルを第3列で開く / false=通常ウィンドウで開く
; Studioは既存の正式ルート。ObsidianとVS Codeを次リリースで有効化。
; Sakuraの第3列ホストは検証段階のため無効のまま（通常起動は可能）。
; ※すでにある %LOCALAPPDATA%\FRBLaunch\state.ini は上書きしません。
embed_studio=true
embed_obsidian=true
embed_vscode=true
embed_sakura=false

; Files Listからのファイルドラッグ方法
; true=Windows Explorer互換（標準） / false=従来のQt方式
; ※既存のstate.iniでは未設定のままでもtrueとして動作
files_list_explorer_drag=true
